name: Build & Release Hermes Edge APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HermesEdge-latest.apk
          ls -lh HermesEdge-latest.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesEdge-APK
          path: HermesEdge-latest.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Build automatica di **Hermes Edge** (Gemma 4 LiteRT-LM + Memoria Hermes + Coding Studio + Controllo Schermo Pixel).\n\nCommit: \`${GITHUB_SHA::7}\`\n\n### Installazione sul Pixel\n1. Tocca **HermesEdge-latest.apk** qui sotto per scaricarlo.\n2. Apri il file scaricato e consenti l'installazione da origini sconosciute.\n3. In **Modello**, importa il tuo file \`.litertlm\` di Gemma 4."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest HermesEdge-latest.apk --clobber
            gh release edit latest --title "Hermes Edge — Ultima Build Android" --notes "$(printf '%b' "$NOTES")"
          else
            gh release create latest HermesEdge-latest.apk \
              --title "Hermes Edge — Ultima Build Android" \
              --notes "$(printf '%b' "$NOTES")" \
              --latest
          fi
