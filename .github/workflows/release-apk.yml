name: Build and verify MobHarn
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 5924fc292618f2472d4512eb2a92ae018d8d9847
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Test and build debug APK
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 365 -dname 'CN=CI Debug'
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            app/schemas/**
            app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Validate version and release source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Build with the protected signing identity
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?}" "${STORE_PASSWORD:?}" "${KEY_PASSWORD:?}" "${EXPECTED_SHA256:?}"
          umask 077
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ ${#actual} == 64 && "${actual,,}" == "${EXPECTED_SHA256,,}" ]]
          cp "$apk" "MobHarn-$GITHUB_REF_NAME.apk"
      - name: Publish a new release (never replace an existing asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MobHarn-$GITHUB_REF_NAME.apk" --verify-tag --title "MobHarn $GITHUB_REF_NAME" --generate-notes
